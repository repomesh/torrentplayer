name: Set up TorrentPlayer build environment
description: >-
  Installs the pinned Rust toolchain, Node.js, Tauri system dependencies, and frontend
  packages, then builds the frontend (Tauri embeds ui/dist/ at compile time).

inputs:
  build-frontend:
    description: Whether to run `npm run build` in ui/.
    default: 'true'
  rust-cache:
    description: Whether to cache Cargo build output. Never enable this in release workflows.
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install Linux system dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
          libayatana-appindicator3-dev librsvg2-dev

    - name: Install pinned Rust toolchain
      shell: bash
      # rustup reads rust-toolchain.toml and installs the exact pinned version.
      run: rustup show active-toolchain || rustup toolchain install

    - name: Cache Cargo build output
      if: inputs.rust-cache == 'true'
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: ui/package-lock.json

    - name: Install frontend dependencies
      shell: bash
      working-directory: ui
      run: npm ci

    - name: Build frontend
      if: inputs.build-frontend == 'true'
      shell: bash
      working-directory: ui
      run: npm run build
