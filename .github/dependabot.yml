version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Wait two weeks after a release before proposing it, so compromised or broken releases
    # are usually caught and yanked first.
    cooldown:
      default-days: 14
    groups:
      tauri:
        patterns: ['tauri', 'tauri-*']
      rust-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build(deps)

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      # svelte-check (and the Svelte language tools) support TypeScript 5 and 6 only; a major
      # bump fails `npm ci`. Lift this when they support the next major.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      tauri:
        patterns: ['@tauri-apps/*']
      lint-and-format:
        patterns:
          [
            'eslint',
            '@eslint/*',
            'eslint-*',
            'typescript-eslint',
            'prettier',
            'prettier-*',
            'globals',
          ]
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build(deps)

  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci(deps)
