name: Build

# Builds unsigned installers for every platform on release pull requests (from release/*
# branches), on pull requests labelled "build", and on demand (Actions → Build → Run workflow),
# and keeps them as workflow artifacts for testing. Other pull requests, Dependabot's included,
# skip it (CI tests them), and so do pushes to main: a release pull request builds every platform
# before it merges, and the release itself builds again from the tag. Changes to documentation
# alone never build. Signed, published builds come from release.yml. See docs/release.md.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build (${{ matrix.name }})
    # Labelling a pull request "build" starts a build; other labels do not.
    if: >-
      github.event_name != 'pull_request' ||
      (startsWith(github.head_ref, 'release/') && github.event.action != 'labeled') ||
      (contains(github.event.pull_request.labels.*.name, 'build') &&
      (github.event.action != 'labeled' || github.event.label.name == 'build'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
          - name: macos-x64
            os: macos-15
            target: x86_64-apple-darwin
          # The oldest supported Ubuntu, so the AppImage and .deb run on older glibc versions.
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tauri builds the frontend itself (beforeBuildCommand).
      - uses: ./.github/actions/setup
        with:
          build-frontend: 'false'

      - name: Add Rust target
        # bash on every runner: PowerShell (the Windows default) would read $TARGET as its own
        # variable, which is empty.
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"

      # The playback-only FFmpeg that converts Dolby and DTS audio (docs/adr/0007), built from
      # the checksummed source and bundled through tauri.sidecar.conf.json. Its source and options
      # live in the script, so a cached build is reused until the script changes. (release.yml
      # always builds it afresh: release builds use no caches.)
      - name: Restore the FFmpeg sidecar
        id: ffmpeg-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/binaries
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Build the FFmpeg sidecar
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            # The runner image's MinGW. FFmpeg's configure needs a POSIX temporary directory,
            # and GCC a Windows one.
            export PATH="/c/mingw64/bin:$PATH" MAKE=mingw32-make
            TMPDIR=$(cygpath -u "$RUNNER_TEMP") TMP=$(cygpath -m "$RUNNER_TEMP") TEMP=$(cygpath -m "$RUNNER_TEMP")
            export TMPDIR TMP TEMP
          fi
          bash scripts/build-ffmpeg.sh "$TARGET" src-tauri/binaries

      # Without a tag, tauri-action only builds; nothing is published.
      - name: Build installers
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        with:
          # The Tauri CLI is installed in ui/; its "tauri" script runs it from the repository root.
          tauriScript: npm --prefix ui run tauri
          args: --target ${{ matrix.target }} --config src-tauri/tauri.sidecar.conf.json

      - name: Collect installers
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          mkdir -p build-assets
          node -e 'for (const p of JSON.parse(process.env.ARTIFACT_PATHS)) console.log(p)' |
            while IFS= read -r path; do
              # .app bundles are directories; their archives (.app.tar.gz) are kept instead.
              if [ -f "$path" ]; then cp "$path" build-assets/; fi
            done
          ls -l build-assets

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.name }}
          path: build-assets/
          if-no-files-found: error
          retention-days: 14
