name: Release

# Builds signed installers for every platform when a version tag is pushed, then publishes them
# with checksums, an SBOM, and build provenance attestations to a draft GitHub release.
# See docs/release.md.
#
# One job creates the draft before the builds start, so the parallel builds never race to create
# a release (v0.2.0 got two drafts). Each platform builds in release-build.yml and is attested and
# uploaded as soon as it is built; a final job adds the SBOM and FFmpeg source and the checksums
# of every file, so every file on the release has a checksum and an attestation.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create the draft release
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A mistyped tag would otherwise build installers named for a version they are not.
      - name: Check the tag matches the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cargo=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          npm=$(node -p 'require("./ui/package.json").version')
          if [ "${TAG#v}" != "$cargo" ] || [ "${TAG#v}" != "$npm" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml ($cargo) and ui/package.json ($npm)."
            exit 1
          fi

      # A re-run finds the draft its first attempt created. The tag must already be on GitHub
      # (--verify-tag), so a release is never created for a new, unsigned tag by mistake.
      - name: Create or find the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # "<id> <draft>" for each release of the tag. Drafts are listed only to tokens that
          # can write, and /releases/tags/{tag} skips them, so the whole list is read.
          existing() {
            gh api --paginate "repos/$GH_REPO/releases" --jq '.[] | [.tag_name, .id, .draft] | @tsv' |
              awk -F '\t' -v tag="$TAG" '$1 == tag { print $2, $3 }'
          }
          found=$(existing)
          if [ "$(printf '%s' "$found" | grep -c .)" -gt 1 ]; then
            echo "::error::There is more than one release for $TAG; delete the extra drafts first."
            exit 1
          fi
          if [ -z "$found" ]; then
            prerelease=()
            case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
            gh release create "$TAG" --draft --verify-tag "${prerelease[@]}" \
              --title "TorrentPlayer $TAG" \
              --notes "See CHANGELOG.md for what changed. Verify downloads as described in docs/release.md."
            # The release list can lag a new draft by a few seconds; wait for it.
            for _ in 1 2 3 4 5 6; do
              found=$(existing)
              [ -n "$found" ] && break
              sleep 5
            done
          fi
          case "$found" in
            *" true") echo "Draft release $found for $TAG" ;;
            *)
              echo "::error::The release for $TAG is already published ($found); not changing it."
              exit 1
              ;;
          esac

  # Each platform builds and is published on its own, so one waiting for a runner (macOS runners
  # are often scarce) does not hold back the others.
  build-windows:
    name: Build windows-x64
    needs: create-release
    uses: ./.github/workflows/release-build.yml
    with:
      name: windows-x64
      os: windows-2025
      target: x86_64-pc-windows-msvc
    # The signing secrets reach the build through its `release` environment.
    secrets: inherit # zizmor: ignore[secrets-inherit]

  build-macos-arm64:
    name: Build macos-arm64
    needs: create-release
    uses: ./.github/workflows/release-build.yml
    with:
      name: macos-arm64
      os: macos-15
      target: aarch64-apple-darwin
      arch: aarch64
    # The signing secrets reach the build through its `release` environment.
    secrets: inherit # zizmor: ignore[secrets-inherit]

  build-macos-x64:
    name: Build macos-x64
    needs: create-release
    uses: ./.github/workflows/release-build.yml
    with:
      name: macos-x64
      os: macos-15
      target: x86_64-apple-darwin
      arch: x64
    # The signing secrets reach the build through its `release` environment.
    secrets: inherit # zizmor: ignore[secrets-inherit]

  # Built on the oldest supported Ubuntu so the AppImage runs on older glibc versions.
  build-linux:
    name: Build linux-x64
    needs: create-release
    uses: ./.github/workflows/release-build.yml
    with:
      name: linux-x64
      os: ubuntu-22.04
      target: x86_64-unknown-linux-gnu
    # The signing secrets reach the build through its `release` environment.
    secrets: inherit # zizmor: ignore[secrets-inherit]

  publish-windows:
    name: Publish windows-x64
    needs: build-windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write # upload to the release
      id-token: write # sign attestations
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installers-windows-x64
          path: release-assets

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" release-assets/* --clobber

  publish-macos-arm64:
    name: Publish macos-arm64
    needs: build-macos-arm64
    runs-on: ubuntu-24.04
    permissions:
      contents: write # upload to the release
      id-token: write # sign attestations
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installers-macos-arm64
          path: release-assets

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" release-assets/* --clobber

  publish-macos-x64:
    name: Publish macos-x64
    needs: build-macos-x64
    runs-on: ubuntu-24.04
    permissions:
      contents: write # upload to the release
      id-token: write # sign attestations
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installers-macos-x64
          path: release-assets

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" release-assets/* --clobber

  publish-linux:
    name: Publish linux-x64
    needs: build-linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write # upload to the release
      id-token: write # sign attestations
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installers-linux-x64
          path: release-assets

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" release-assets/* --clobber

  # Runs once every platform has been published or has failed, and again whenever a failed one is
  # re-run, so SHA256SUMS.txt always covers every file on the release.
  finish:
    name: Checksums, SBOM, and FFmpeg source
    needs: [create-release, publish-windows, publish-macos-arm64, publish-macos-x64, publish-linux]
    if: always() && needs.create-release.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # upload the checksums, SBOM, and FFmpeg source
      id-token: write # sign attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every installer the publish jobs uploaded (each already attested there).
      - name: Download the published installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p installers extras
          gh release download "$TAG" --dir installers --clobber
          rm -f installers/SHA256SUMS.txt installers/torrentplayer.cdx.json installers/ffmpeg-*.tar.xz
          ls -l installers

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-cyclonedx@0.5.9

      - name: Generate SBOM
        run: |
          cargo cyclonedx --manifest-path src-tauri/Cargo.toml --format json --spec-version 1.5 \
            --override-filename torrentplayer
          # cargo-cyclonedx versions differ in the extension they add (.json or .cdx.json).
          sbom=$(find src-tauri -maxdepth 1 -name 'torrentplayer*.json' | head -n 1)
          if [ -z "$sbom" ]; then
            echo "::error::cargo cyclonedx wrote no torrentplayer*.json in src-tauri"
            ls -la src-tauri
            exit 1
          fi
          cp "$sbom" extras/torrentplayer.cdx.json

      # The FFmpeg sidecar is LGPL: its exact source is published with every release.
      - name: Add the FFmpeg source
        run: bash scripts/build-ffmpeg.sh source extras

      - name: Generate checksums
        run: |
          (cd installers && sha256sum -- *) > extras/SHA256SUMS.txt
          (cd extras && sha256sum -- torrentplayer.cdx.json ffmpeg-*.tar.xz) >> extras/SHA256SUMS.txt
          cat extras/SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: extras/*

      - name: Upload the checksums, SBOM, and FFmpeg source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" extras/* --clobber
