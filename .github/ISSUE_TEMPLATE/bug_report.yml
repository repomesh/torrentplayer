name: Bug report
description: Something does not work as expected.
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For security issues, use private reporting instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add the torrent ...
        2. Play lecture ...
        3. Seek to ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TorrentPlayer version or commit
      placeholder: v0.1.0 or a commit SHA
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: e.g. Windows 11 24H2, macOS 15.1, Ubuntu 24.04
  - type: dropdown
    id: network-mode
    attributes:
      label: Network mode
      options: [Direct, Bound interface, Built-in WireGuard, SOCKS5 proxy, Not sure]
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Run with RUST_LOG=debug if you can. Remove anything private (IP addresses, file paths) first.
      render: text
