[package]
name = "torrentplayer-net"
description = "Network modes for TorrentPlayer: direct, bound interface, SOCKS5 proxy, and WireGuard configs, with a kill switch."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
getrandom.workspace = true
dns-parser.workspace = true
if-addrs.workspace = true
librqbit-upnp.workspace = true
reqwest = { workspace = true, features = ["socks"] }
serde.workspace = true
serde_json.workspace = true
socket2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tokio-util.workspace = true
tokio-wireguard.workspace = true
tracing.workspace = true
ts-rs.workspace = true
url.workspace = true
zeroize.workspace = true

[features]
# A recording SOCKS5 proxy and TCP relay for other crates' tests. Never enabled in the app.
test-util = []

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread"] }

[lints]
workspace = true
