[env]
# Where `ts-rs` writes TypeScript bindings generated from Rust IPC types (see docs/ipc.md).
TS_RS_EXPORT_DIR = { value = "src/lib/bindings", relative = true }
# IPC payloads are JSON, so 64-bit integers arrive as JavaScript numbers, not `bigint`.
# Byte counts stay far below 2^53.
TS_RS_LARGE_INT = "number"
