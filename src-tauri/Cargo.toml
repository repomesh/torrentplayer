[package]
name = "lumen-app"
description = "TorrentStream desktop app shell (Tauri)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "lumen_app"
crate-type = ["rlib"]

[[bin]]
name = "lumen"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[target.'cfg(windows)'.build-dependencies]
# Already used by tauri-build; used directly to embed the manifest into test binaries too.
embed-resource = "3.0"

[dependencies]
anyhow.workspace = true
# Thumbnails reach the webview as data: URLs.
base64.workspace = true
bytes.workspace = true
lumen-library.workspace = true
lumen-net.workspace = true
lumen-media.workspace = true
lumen-prioritize.workspace = true
lumen-search.workspace = true
lumen-settings.workspace = true
lumen-stream.workspace = true
lumen-torrent.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ts-rs.workspace = true
url.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
