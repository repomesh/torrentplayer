[package]
name = "torrentplayer-app"
description = "TorrentPlayer desktop app shell (Tauri)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "torrentplayer_app"
crate-type = ["rlib"]

[[bin]]
name = "torrentplayer"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[target.'cfg(windows)'.build-dependencies]
# Already used by tauri-build; used directly to embed the manifest into test binaries too.
embed-resource = "3.0"

[dependencies]
anyhow.workspace = true
# Thumbnails reach the webview as data: URLs.
base64.workspace = true
bytes.workspace = true
torrentplayer-library.workspace = true
torrentplayer-net.workspace = true
torrentplayer-media.workspace = true
torrentplayer-prioritize.workspace = true
torrentplayer-search.workspace = true
torrentplayer-settings.workspace = true
torrentplayer-stream.workspace = true
torrentplayer-torrent.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
thiserror.workspace = true
# Runs the FFmpeg sidecar that converts Dolby and DTS audio.
tokio = { workspace = true, features = ["io-util", "process"] }
tracing.workspace = true
tracing-subscriber.workspace = true
ts-rs.workspace = true
url.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
